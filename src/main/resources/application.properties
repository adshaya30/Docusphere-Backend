# Database Configuration - PostgreSQL
spring.datasource.url=${DB_URL}&prepareThreshold=0
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase Configuration
supabase.url=${SUPABASE_URL}
supabase.service.key=${SUPABASE_SERVICE_KEY}
supabase.bucket.documents=${SUPABASE_BUCKET}
supabase.bucket.profile=profile-pictures


# Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=true
# Temporary - only for repair
spring.flyway.repair=true
spring.flyway.validate-on-migrate=false


# Admin Configuration
app.admin-emails=${ADMIN_EMAILS:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Email Configuration - Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.socketFactory.port=587
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Session Configuration
# Session expiry: 1 day (milliseconds)
app.session.expiry=86400000
# Remember-me expiry: 7 days (milliseconds)
app.session.remember-me-expiry=604800000


# Optional but recommended for dev
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Base upload directory
app.upload.dir=${APP_UPLOAD_DIR:${user.dir}/uploads}

# Soft-deleted document cleanup scheduler (daily 2 AM by default)
app.document.cleanup.cron=${DOCUMENT_CLEANUP_CRON:0 0 2 * * *}
app.share.default-expiry-hours=${APP_SHARE_DEFAULT_EXPIRY_HOURS:24}

# Maximum chunk size (5MB allows frontend control of 5MB chunks without Tomcat failing)
spring.servlet.multipart.max-file-size=50MB

# Maximum request size (entire multipart request limit per chunk)
spring.servlet.multipart.max-request-size=100MB

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/auth/oauth2/callback/{registrationId}
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/api/auth/oauth2/callback/{registrationId}
spring.security.oauth2.client.provider.github.user-name-attribute=id