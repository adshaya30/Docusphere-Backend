# Database Configuration - PostgreSQL
spring.datasource.url=${DB_URL}&prepareThreshold=0
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
supabase.url=${SUPABASE_URL:https://placeholder.supabase.co}
supabase.service.key=${SUPABASE_SERVICE_KEY:placeholder-key}
supabase.bucket.documents=${SUPABASE_BUCKET:Documents}

# Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=true
# Temporary - only for repair
# Removed invalid repair property
spring.flyway.validate-on-migrate=false


# Admin Configuration
app.admin-emails=${ADMIN_EMAILS:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Email Configuration - Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.socketFactory.port=587
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Session Configuration
# Session expiry: 1 day (milliseconds)
app.session.expiry=86400000
# Remember-me expiry: 7 days (milliseconds)
app.session.remember-me-expiry=604800000

# Multipart upload limits (set above Tomcat default 1MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Optional but recommended for dev
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Python & OCR Configuration
ocr.python.executable=e:/DOCUMENT ANLYSY05/Docusphere-Backend/venv/Scripts/python.exe
ocr.python.script.path=scripts/paddle_ocr.py
ocr.analysis.script.path=scripts/analyze_text.py

# File Upload Configuration
app.upload.dir=${APP_UPLOAD_DIR:uploads}
