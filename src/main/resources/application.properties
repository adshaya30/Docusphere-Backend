# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (Absolute Minimum for Free Tier)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=8080

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Python & OCR Configuration
ocr.python.executable=e:/DOCUMENT ANLYSY05/Docusphere-Backend/venv/Scripts/python.exe
ocr.python.script.path=scripts/paddle_ocr.py
ocr.analysis.script.path=scripts/analyze_text.py

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Lombok & Logging
logging.level.org.hibernate.SQL=DEBUG

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
