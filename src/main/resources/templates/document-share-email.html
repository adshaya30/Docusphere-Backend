<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Document Shared - DocuSphere</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffffff; margin: 0; padding: 0; color: #333;">
    <!-- Header -->
    <div style="padding: 40px 30px; text-align: center;">
        <div style="font-size: 32px; font-weight: 700; color: #114692; margin: 0; letter-spacing: 0.5px;">Document shared</div>
    </div>

    <!-- Content -->
    <div style="padding: 50px 45px; text-align: center;">
        <div style="font-size: 24px; font-weight: 700; margin-bottom: 20px; color: #05152C; letter-spacing: 0.2px;">
            <span th:text="${ownerName}">Owner</span> shared a document with you
        </div>

        <div style="font-size: 16px; line-height: 1.8; color: #555; margin-bottom: 40px; font-weight: 500;">
            The document <strong th:text="${documentName}">Document name</strong> is ready to open.
        </div>

        <div style="text-align: center; margin: 35px 0;">
            <a th:href="${shareUrl}" style="display: inline-block; background: linear-gradient(to right, #114692, #05152C); color: #FFFFFF; padding: 15px 40px; text-decoration: none; border-radius: 16px; font-weight: 600; font-size: 18px; letter-spacing: 0.3px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(17, 70, 146, 0.3); transition: all 300ms ease-in-out; min-width: 150px;">Open document</a>
        </div>

        <div style="margin: 40px 0;">
            <div style="font-size: 16px; color: #666; margin-bottom: 12px; font-weight: 500;">Or copy and paste this link into your browser:</div>
            <div style="padding: 16px; border-radius: 6px; font-size: 15px; color: #0066cc; margin: 0 auto; max-width: 100%; word-break: break-word; white-space: normal; overflow-wrap: break-word;">
                <a th:href="${shareUrl}" th:text="${shareUrl}" style="color: #0066cc; text-decoration: none; word-break: break-word; display: block; font-size: 15px;"></a>
            </div>
        </div>
    </div>
</body>
</html>
