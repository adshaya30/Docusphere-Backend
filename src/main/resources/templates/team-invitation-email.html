<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Team Invitation</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">
        <h2 style="color: #4A90E2;">You've been invited to join a team!</h2>
        <p>Hi there,</p>
        <p th:text="${inviterName} + ' has invited you to join the team: ' + ${teamName} + ' on DocuSphere.'"></p>
        <p>To join the team, please sign up or sign in to your DocuSphere account using this email address.</p>
        <div style="text-align: center; margin: 30px 0;">
            <a th:href="${link}" href="#" style="display: inline-block; background-color: #4A90E2; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold;">Join Team</a>
        </div>
        <p>If you don't have an account yet, you can create one by clicking the button above.</p>
        <p>Best regards,<br>The DocuSphere Team</p>
    </div>
</body>
</html>
