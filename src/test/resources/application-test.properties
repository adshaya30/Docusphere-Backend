spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false
spring.h2.console.enabled=false

# Safe local stubs for storage-related beans
supabase.url=http://localhost
supabase.service.key=test-service-key
supabase.bucket.documents=documents

# Safe local mail defaults so mail beans can initialize in tests
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=

jwt.secret=test-secret
jwt.expiration=86400000

app.session.expiry=86400000
app.session.remember-me-expiry=604800000

app.frontend-url=http://localhost:5173
app.share.default-expiry-hours=168

# Keep uploads inside the build workspace during tests
app.upload.dir=target/test-uploads
app.document.cleanup.cron=-
app.admin-emails=

logging.level.com.docusphere=DEBUG
logging.level.org.springframework=INFO

